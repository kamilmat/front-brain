name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: skip onnxruntime-node / sharp native downloads (browser-only)
      - run: npm ci --ignore-scripts
      - run: npm run build
